# Runs the test suite on a clean machine at every push. The tests are hermetic: no
# network, no credentials, none of the athlete's files, so no secret is needed here.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project with its test dependencies
        run: pip install --quiet -e ".[dev]"

      - name: Run the tests
        run: pytest
